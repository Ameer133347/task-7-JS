
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Order</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Coffee Order</h1>
        <p class="subtitle">Place your coffee order</p>

        <form id="orderForm" novalidate>
            <div class="form-group">
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                >
                <small class="error" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="01xxxxxxxxx"
                >
                <small class="error" id="phoneError"></small>
            </div>

            <div class="form-group">
                <label for="product">Product</label>
                <select id="product" name="product">
                    <option value="">Select a product</option>
                    <option value="Espresso">Espresso — 45 EGP</option>
                    <option value="Latte">Latte — 65 EGP</option>
                    <option value="Croissant">Croissant — 40 EGP</option>
                </select>
                <small class="error" id="productError"></small>
            </div>

            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    placeholder="Enter quantity (1-10)"
                >
                <small class="error" id="quantityError"></small>
            </div>

            <button type="submit" id="orderButton">Order Now</button>
        </form>

        <section class="orders-section">
            <h2>Your Orders</h2>
            <div id="ordersList" aria-live="polite">
                <p class="empty-message">No orders yet.</p>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
